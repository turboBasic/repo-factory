name: "On PR: Populate PR Description"

# `opened` only: the capability renders into the body as it stands, and declines rather than
# overwriting one written without the substitution points.
on:
  pull_request:
    types:
      - opened

jobs:
  populate-pr-description:
    permissions:
      contents: read
      pull-requests: write
    uses: turboBasic/github-actions/.github/workflows/pr-description.yml@v0.1
